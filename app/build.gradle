apply plugin: 'com.android.application'

// Release signing. The keystore lives OUTSIDE the repo: point
// SORINFLOW_KEYSTORE_PROPERTIES at a properties file (default
// ~/.sorinflow-keys/keystore.properties) holding storeFile (absolute path),
// storePassword, keyAlias and keyPassword. Without it the release APK is built
// unsigned, so a missing keystore never breaks a plain build.
def keystorePropsPath = System.getenv("SORINFLOW_KEYSTORE_PROPERTIES")
        ?: "${System.getProperty('user.home')}/.sorinflow-keys/keystore.properties"
def keystorePropsFile = file(keystorePropsPath)
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystoreProps.getProperty('storeFile') != null

// Server address baked into official builds as BuildConfig.DEFAULT_SERVER_URL.
// It comes from the SORINFLOW_SERVER_URL environment variable (a GitHub Actions
// secret in CI) or -PsorinflowServerUrl=...; a plain local build leaves it empty
// and the setup screen simply starts blank.
def sorinflowServerUrl = (project.findProperty('sorinflowServerUrl')
        ?: System.getenv('SORINFLOW_SERVER_URL') ?: '').toString().trim()
def updateRepo = (project.findProperty('sorinflowUpdateRepo')
        ?: 'sobhanaz/sorinflow-sms-forwarder').toString().trim()

android {
    // The Java namespace stays tech.bogomolov.incomingsmsgateway so merging
    // upstream doesn't turn into a whole-tree rename; the applicationId below is
    // the app's identity on the device and in `pm list packages`.
    namespace 'tech.bogomolov.incomingsmsgateway'
    // compileSdk 35 is what current AndroidX (core 1.16+) requires; targetSdk
    // stays 34 on purpose (35 would switch the app to enforced edge-to-edge).
    compileSdkVersion 35

    defaultConfig {
        applicationId "ir.sorinflow.smsforwarder"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 16
        // Rolling CI builds append "+main.<build number>" (-PsorinflowVersionSuffix).
        versionName "3.1.1" + (project.findProperty('sorinflowVersionSuffix') ?: '')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${sorinflowServerUrl}\""
        // GitHub repo whose Releases the in-app update check reads ("" disables it).
        buildConfigField "String", "UPDATE_REPO", "\"${updateRepo}\""
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Let unmocked android.* calls (e.g. Log.e in error paths) return defaults
        // instead of throwing, so logic touching them stays JVM-unit-testable.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    def work_version = "2.9.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    // In-app QR scanner for the panel's setup code.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    // The mockable android.jar used by JVM unit tests stubs org.json (every
    // method returns null/0); this real implementation shadows it so tests can
    // parse the JSON the app produces.
    testImplementation 'org.json:json:20260814'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "org.mockito:mockito-android:5.23.0"
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation "androidx.work:work-testing:$work_version"
    // Local HTTP server for the end-to-end delivery test.
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
}
