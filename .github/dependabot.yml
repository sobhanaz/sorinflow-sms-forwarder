# One grouped pull request a month for everything (Gradle dependencies and the
# GitHub Actions used by the workflows), so the repository never fills up with
# per-dependency branches. Security advisories still arrive on their own.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - "*"
