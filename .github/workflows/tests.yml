name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }} emulator)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 30 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration, which requires KVM access.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          # A phone-sized profile so the README screenshots are sharp.
          profile: pixel_4
          # ScreenshotsTest writes PNGs of the app's screens; pull them while
          # the emulator is still up, whatever the test outcome.
          script: |
            ./gradlew connectedDebugAndroidTest; status=$?
            adb pull /sdcard/Download/sorinflow-screenshots screenshots || echo "no screenshots to pull"
            mkdir -p screenshots
            adb logcat -d -s EndToEnd:I SmsGateway:I | grep -E "SMS injected|delivery kind" > screenshots/e2e-latency.txt || echo "no latency lines in logcat"
            exit $status

      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-api${{ matrix.api-level }}
          path: screenshots
          if-no-files-found: ignore

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected
